[project]
name = "gothic-thematic-analysis-engine"
version = "0.1.0"
description = "NLP system for analyzing and generating Gothic literature with controllable themes"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "scikit-learn>=1.0",
    "transformers>=4.30",
    "datasets>=2.14",
    "torch>=2.0",
    "accelerate>=0.20",
]

[project.optional-dependencies]
labeler = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "jinja2>=3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
