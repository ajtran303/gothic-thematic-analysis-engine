themes:
  - name: supernatural
    description: Vampires, ghosts, apparitions, the undead, or other supernatural phenomena.
    indicators:
      - vampire, vampyre, ghost, phantom, spectre
      - apparition, spirit, undead, haunted
      - supernatural, unearthly, from the grave
      - embalmed, risen, visitation

  - name: captivity
    description: Physical captivity, confinement, detention, being chased, or fleeing. Escape attempts and rescue.
    indicators:
      - prisoner, captive, confined, detained
      - dungeon, cell, tower, locked, chains
      - escape, fled, rescue, deliverance
      - seized, entrapped, held against will
      - pursue, pursued, chase, chased
      - flee, flight, hunt, hunted
      - run, running, overtake, capture

  - name: secrecy
    description: Hidden information, concealed identities, or characters withholding truth.
    indicators:
      - secret, concealed, hidden, mysterious
      - disguise, unknown, veiled, enigmatic
      - revealed, discovered, confession
      - whispered, cryptic, undisclosed

  - name: love
    description: Romantic attachment, courtship, passion, or heartbreak.
    indicators:
      - love, beloved, passion, affection
      - lover, suitor, marriage, betrothed
      - tender, devoted, longing, jealous
      - kiss, embrace, wedding, parting

  - name: harm
    description: Death, dying, murder, corpses, violence, blood, or physical brutality.
    indicators:
      - death, dying, dead, corpse, body
      - grave, tomb, funeral, burial, murder
      - grief, mourning, loss, killed
      - last breath, expired, lifeless
      - blood, bloody, wound, wounded
      - strike, struck, stab, stabbed
      - attack, assault, brutal, savage
      - blow, beaten, bruise, torn

  - name: villainy
    description: Scheming, conspiracy, treachery, persecution, or antagonistic behavior. Villains victimizing others.
    indicators:
      - villain, tyrant, persecutor, enemy
      - pursued, threatened, hunted, accused
      - scheme, plot, treachery, revenge
      - victim, injustice, oppression
      - conspiracy, betrayal, deceive, manipulate

  - name: family
    description: Parent-child bonds, inheritance, lineage, and duty to kin.
    indicators:
      - father, mother, parent, son, daughter
      - inheritance, heir, estate, fortune
      - ancestor, lineage, bloodline
      - duty, consent, forbid, disobey

  - name: sorrow
    description: Sadness, regret, emotional suffering, despair, loneliness, or isolation.
    indicators:
      - melancholy, sorrow, grief, despair
      - tears, weeping, sighing, dejected
      - gloomy, wretched, miserable
      - regret, lament, anguish, woe
      - alone, lonely, solitary, isolated
      - abandoned, forsaken, deserted
      - no friend, no companion, separated
      - exile, outcast, estranged

  - name: anguish
    description: Intense fear, horror, dread, guilt, remorse, insanity, or psychological torment.
    indicators:
      - terror, horror, dread, fright, fear
      - trembling, shuddering, pale, gasped
      - scream, shriek, alarmed, panic
      - nightmare, apprehension, aghast
      - mad, madness, insane, insanity
      - delirium, delirious, frenzied, frenzy
      - lunatic, maniac, deranged, unhinged
      - guilt, guilty, remorse, conscience
      - repent, repentance, atonement, shame
      - torment, haunt, accuse, blame

  - name: setting
    description: Atmospheric environments—storms, wilderness, moonlight, or Gothic architecture like castles, ruins, and abbeys.
    indicators:
      - storm, tempest, thunder, lightning
      - moon, moonlight, night, darkness
      - forest, wilderness, mountain, sea
      - wind, rain, mist, shadows
      - castle, tower, dungeon, ruin
      - abbey, cathedral, vault, crypt
